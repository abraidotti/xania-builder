[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xania-builder"
version = "0.1.0"
description = "Xania Builder: research, gate and ship changes to the Xania MUD, using Xania Explorer and Xania Sim"
requires-python = ">=3.12"
dependencies = []  # stdlib only; Explorer and Sim are found from builder.toml (sibling checkouts) or installed

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["xania_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
